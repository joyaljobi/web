    .social-bar-wrapper {

    .social-bar {

    }

    .social-bar.show {

  opacity: 1;
  pointer-events: auto;
    }

    .social-icon {

      text-decoration: none;
      color: #fff;
      transition: background-color 0.3s, color 0.3s;
    }

   

    .toggle-btn {
